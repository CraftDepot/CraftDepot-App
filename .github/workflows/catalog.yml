name: Catalog

on:
  push:
    branches: [main]
    paths: ["catalog/**", "installer/**", ".github/workflows/catalog.yml"]
  pull_request:
    paths: ["catalog/**", "installer/**", ".github/workflows/catalog.yml"]
  schedule:
    # Hourly: rebuild releases.json, so launchers hear about new releases within the hour.
    - cron: "23 * * * *"
    # Daily: also check every app's release files still match the catalog's patterns.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check catalog.json against the apps' repositories and latest releases
        run: node catalog/check.mjs --online
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint the shell scripts
        run: shellcheck installer/install.sh scripts/dist.sh

  # Publishes to https://craftdepot.app/: catalog.json (with featured.json merged in),
  # which every launcher polls; releases.json, every app's latest release and stars; the install
  # scripts; and the website, built from those files out of the private CraftDepot-Site repository.
  deploy:
    needs: check
    # A push publishes only a catalog that passed the check. The scheduled runs publish anyway: one
    # project renaming its files shouldn't hold back everyone else's updates.
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      (needs.check.result == 'success' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # publish.mjs dates new apps from catalog.json's history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect the files
        run: |
          mkdir _site
          node catalog/publish.mjs _site
          cp installer/install.ps1 installer/install.sh _site/
      - name: Gather every app's latest release and stars
        run: node catalog/releases.mjs _site/releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The website replaces catalog/index.html at the root. Launchers only need the files above, so
      # if the site can't be checked out or built, the catalog is published anyway with its own page.
      - name: Check out the website
        id: site
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: CraftDepot/CraftDepot-Site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      - name: Build the website
        id: site-build
        if: steps.site.outcome == 'success'
        continue-on-error: true
        run: |
          node site/build.mjs --catalog _site/catalog.json --releases _site/releases.json --out site/dist
          cp -r site/dist/. _site/
      - name: Warn when the website is left out
        if: steps.site-build.outcome != 'success'
        run: echo "::warning::The website wasn't built, so this publish has only the catalog's own page. Is SITE_DEPLOY_KEY set?"
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
