name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["catalog/**", "**.md"]
  pull_request:
    paths-ignore: ["catalog/**", "**.md"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux windowing headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Install ripgrep from GitHub end to end
        run: cargo test -- --ignored
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
